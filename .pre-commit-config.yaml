# Pre-commit hooks for Project Aurum
repos:
  # Python code formatting and linting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile, black, --line-length=100]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=100, --extend-ignore=E203,W503]
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies: [types-requests, types-redis]

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-r', 'src/', '-f', 'json', '-o', 'bandit-report.json']
        pass_filenames: false

  # General code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: debug-statements
      - id: fix-encoding-pragma
        args: [--remove]

  # Python imports
  - repo: https://github.com/pycqa/autoflake
    rev: v2.2.1
    hooks:
      - id: autoflake
        args:
          - --remove-all-unused-imports
          - --remove-unused-variables
          - --remove-duplicate-keys
          - --in-place

  # Documentation
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--convention=google, --add-ignore=D100,D101,D102,D103,D104,D105]

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3009]

  # Frontend (Node.js/TypeScript)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: \.(js|ts|tsx)$
        args: [--fix]
        additional_dependencies:
          - eslint@8.56.0
          - '@typescript-eslint/eslint-plugin@6.21.0'
          - '@typescript-eslint/parser@6.21.0'

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  # SQL formatting (if you have SQL files)
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.0.2
    hooks:
      - id: sqlfluff-lint
        files: \.sql$
      - id: sqlfluff-fix
        files: \.sql$

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(yaml|yml|json|md)$
        args: [--prose-wrap=always, --print-width=100]

  # Financial/Trading specific checks
  - repo: local
    hooks:
      - id: check-api-keys
        name: Check for exposed API keys
        entry: python -c "import re, sys; [sys.exit(1) for line in sys.stdin if re.search(r'(api_key|secret_key|password)\s*=\s*[\"\']\w+', line, re.I)]"
        language: system
        files: \.(py|js|ts|tsx|env)$

      - id: check-trading-constants
        name: Validate trading constants
        entry: python scripts/validate_trading_constants.py
        language: python
        files: src/.*\.py$
        pass_filenames: false

      - id: check-indonesian-market-data
        name: Validate Indonesian market configuration
        entry: python -c "
import yaml
import sys
try:
    with open('config/market_config.yaml', 'r') as f:
        config = yaml.safe_load(f)
    assert config['timezone'] == 'Asia/Jakarta'
    assert 'IDX' in config['exchanges']
    print('✅ Indonesian market configuration valid')
except Exception as e:
    print(f'❌ Market configuration error: {e}')
    sys.exit(1)
        "
        language: python
        files: config/.*\.(yaml|yml)$
        pass_filenames: false

# Configuration
default_language_version:
  python: python3.11
  node: '18'

fail_fast: false
minimum_pre_commit_version: 2.20.0