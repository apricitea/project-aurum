version: '3.8'

services:
  # PostgreSQL Database - Production
  postgres:
    image: postgres:15-alpine
    container_name: aurum_prod_postgres
    environment:
      POSTGRES_DB: ${PROD_DB_NAME:-aurum_production}
      POSTGRES_USER: ${PROD_DB_USER:-aurum_user}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
      - ./backups:/backups
    networks:
      - production_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USER:-aurum_user} -d ${PROD_DB_NAME:-aurum_production}"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Redis Cache - Production
  redis:
    image: redis:7-alpine
    container_name: aurum_prod_redis
    command: >
      redis-server
      --appendonly yes
      --requirepass ${PROD_REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - prod_redis_data:/data
    networks:
      - production_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  # Main API Service - Production
  api:
    image: ghcr.io/apricitea/project-aurum:${IMAGE_TAG:-latest}
    container_name: aurum_prod_api
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${PROD_DB_NAME:-aurum_production}
      - DB_USER=${PROD_DB_USER:-aurum_user}
      - DB_PASSWORD=${PROD_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${PROD_REDIS_PASSWORD}
      - JWT_SECRET_KEY=${PROD_JWT_SECRET_KEY}
      - MARKET_TIMEZONE=Asia/Jakarta
      - API_WORKERS=4
      - LOG_LEVEL=INFO
      - ENABLE_DEBUG_MODE=false
      - CORS_ORIGINS=["https://aurum-trading.com", "https://app.aurum-trading.com"]
      # Production optimizations
      - CACHE_TTL=3600
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW=60
      - CONNECTION_POOL_SIZE=20
      - CONNECTION_POOL_OVERFLOW=0
      # Security settings
      - SECURE_COOKIES=true
      - SESSION_TIMEOUT=3600
      - MAX_LOGIN_ATTEMPTS=5
      - LOCKOUT_DURATION=900
      # External services
      - EMAIL_ENABLED=${EMAIL_ENABLED:-true}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-true}
      - SMS_ENABLED=${SMS_ENABLED:-false}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - YAHOO_FINANCE_ENABLED=true
      # Monitoring
      - SENTRY_DSN=${SENTRY_DSN}
      - DATADOG_API_KEY=${DATADOG_API_KEY}
    volumes:
      - ./models:/app/models:ro
      - prod_logs:/app/logs
      - ./reports:/app/reports
      - ./backups:/app/backups
    networks:
      - production_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Celery Worker - Production
  celery_worker:
    image: ghcr.io/apricitea/project-aurum:${IMAGE_TAG:-latest}
    container_name: aurum_prod_celery_worker
    command: celery -A src.api.main:celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=1000
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${PROD_DB_NAME:-aurum_production}
      - DB_USER=${PROD_DB_USER:-aurum_user}
      - DB_PASSWORD=${PROD_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${PROD_REDIS_PASSWORD}
      - JWT_SECRET_KEY=${PROD_JWT_SECRET_KEY}
      - LOG_LEVEL=INFO
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - ./models:/app/models:ro
      - prod_logs:/app/logs
      - ./reports:/app/reports
    networks:
      - production_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Celery Beat Scheduler - Production
  celery_beat:
    image: ghcr.io/apricitea/project-aurum:${IMAGE_TAG:-latest}
    container_name: aurum_prod_celery_beat
    command: celery -A src.api.main:celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${PROD_DB_NAME:-aurum_production}
      - DB_USER=${PROD_DB_USER:-aurum_user}
      - DB_PASSWORD=${PROD_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${PROD_REDIS_PASSWORD}
      - JWT_SECRET_KEY=${PROD_JWT_SECRET_KEY}
      - LOG_LEVEL=INFO
      - MARKET_TIMEZONE=Asia/Jakarta
    volumes:
      - ./models:/app/models:ro
      - prod_logs:/app/logs
      - celery_beat_data:/tmp
    networks:
      - production_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # Nginx Reverse Proxy - Production
  nginx:
    image: nginx:alpine
    container_name: aurum_prod_nginx
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./static:/var/www/static:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - production_network
    depends_on:
      - api
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Monitoring - Production
  prometheus:
    image: prom/prometheus:latest
    container_name: aurum_prod_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prod_prometheus_data:/prometheus
    networks:
      - production_network
      - monitoring_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.25'

  # Grafana Dashboard - Production
  grafana:
    image: grafana/grafana:latest
    container_name: aurum_prod_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${PROD_GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://monitoring.aurum-trading.com
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - prod_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - production_network
      - monitoring_network
    depends_on:
      - prometheus
    restart: always

  # Log Management - Filebeat
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.8.0
    container_name: aurum_prod_filebeat
    user: root
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - prod_logs:/app/logs:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS}
      - KIBANA_HOST=${KIBANA_HOST}
    networks:
      - production_network
    restart: always

  # Backup Service
  backup:
    image: postgres:15-alpine
    container_name: aurum_prod_backup
    environment:
      - PGPASSWORD=${PROD_DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: >
      sh -c "
      echo '0 2 * * * /backup.sh ${PROD_DB_USER} ${PROD_DB_NAME} postgres' | crontab - &&
      crond -f
      "
    networks:
      - production_network
    depends_on:
      - postgres
    restart: always

  # Health Check Service
  healthcheck:
    image: ghcr.io/apricitea/project-aurum:${IMAGE_TAG:-latest}
    container_name: aurum_prod_healthcheck
    command: python /app/scripts/health_monitor.py
    environment:
      - ENVIRONMENT=production
      - API_URL=http://api:8000
      - CHECK_INTERVAL=30
      - ALERT_WEBHOOK=${SLACK_WEBHOOK_URL}
      - PAGERDUTY_API_KEY=${PAGERDUTY_API_KEY}
    volumes:
      - ./scripts:/app/scripts:ro
    networks:
      - production_network
    depends_on:
      - api
    restart: always

volumes:
  prod_postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/aurum/data/postgres
  prod_redis_data:
    driver: local
  prod_prometheus_data:
    driver: local
  prod_grafana_data:
    driver: local
  prod_logs:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local
  celery_beat_data:
    driver: local

networks:
  production_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  monitoring_network:
    driver: bridge
    external: true