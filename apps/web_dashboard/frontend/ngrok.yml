version: "3"

tunnels:
  frontend:
    proto: http
    addr: 3001
    traffic_policy:
      on_http_request:
        - actions:
            - type: oauth
              config:
                provider: google
        - expressions:
            - "actions.ngrok.oauth.identity.email != 'apeirodox@gmail.com'"
          actions:
            - type: deny
              config:
                status_code: 403
